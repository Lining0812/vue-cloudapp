<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: beige;
      }

      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="split">
        <h1>This is a TextSplit content.This is a TextSplit content.This is a TextSplit content.This is a TextSplit content.</h1>
      </div>
    </div>
    <script>
      gsap.registerPlugin(SplitText);

      let split = SplitText.create(".split", {
        type: "lines",
        mask: "lines",
        wordsClass: "lines++",
      });

      gsap.from(split.lines, {
        autoAlpha: 0,
        y: -100,
        duration: 2,
        ease: "power4",
        stagger: 0.1,
      });
    </script>
  </body>
</html>
