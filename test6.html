<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #fff;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        p#logo {
            text-transform: uppercase;
            font-weight: 700;
        }

        button {
            border: none;
            outline: none;
            font-weight: 500;
            color: #000;
            padding: 0.75em 1em;
            background-color: #fff;
            border-radius: 0.25em;
        }

        section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .intro {
            background: url('./src/assets/images/T6.jpg') no-repeat 50% 50%;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .intro h1 {
            width: 75%;
            text-align: center;
            color: #fff;
            font-size: 100px;
            font-weight: 700;
            line-height: 1.125;
        }

        .outro {
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: 200% 200%;
        }

        .outro p {
            width: 75%;
            text-align: center;
            color: #fff;
            font-size: 52px;
            font-weight: 400;
            line-height: 1.125;
        }

        .outro p span {
            color: #75e1ff;
        }

        .cards {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw;
            height: 600px;
            will-change: transform;
        }

        .card {
            position: absolute;
            width: 500px;
            height: 550px;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            margin-left: -250px;
            display: flex;
            flex-direction: column;
            gap: 1em;
            will-change: transform;
        }

        .card-img {
            flex: 1;
            border-radius: 0.5em;
            overflow: hidden;
        }

        .card-content {
            width: 100%;
            height: 60px;
        }

        .card-content p {
            text-align: left;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.25;
        }

        .step-counter {
            position: absolute;
            display: flex;
            flex-direction: column;
            margin: 2em;
        }

        .counter-title,
        .count {
            position: relative;
            width: 1200px;
            height: 150px;
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
            overflow: hidden;
        }

        .count {
            top: -10px;
        }

        .count-container {
            position: relative;
            transform: translate(150px);
            will-change: transform;
        }

        .step-counter h1 {
            width: 100%;
            position: relative;
            color: #fff;
            text-transform: uppercase;
            font-weight: 900;
            font-size: 150px;
            line-height: 1;
            letter-spacing: -0.04em;
            will-change: transform;
        }

        .empty {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <nav>
            <p id="logo">Voxel</p>

    </div>

    <section class="intro">
        <h1>专辑专辑单曲单曲</h1>

    <section class="steps">
        <div class="step-counter">
            <div class="counter-title">
                <h1>专辑|Album</h1>
            </div>
            <!-- <div class="count">

                    <h1>04</h1>

                </div>

        </div>
        <div class="cards">
            <div class="card">
                <div class="card-img">
                    <img src="/src/assets/images/T1.jpg" alt="aaa">
                </div>

            <div class="card">

                    <p>打开</p>

            <div class="card">
                <div class="card-img">
                    <img src="/src/assets/images/T4.jpg" alt="aaa">
                </div>
                <div class="card-content">
                    <p>Oracle</p>
                </div>
            </div>
            <div class="card">
                <div class="card-img">
                    <img src="/src/assets/images/T5.jpg" alt="aaa">

    <section class="outro">
        <P>This is <span>outro</span> content</P>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            gsap.registerPlugin(ScrollTrigger);

            const stickySection = document.querySelector('.steps');
            const stickyHeight = window.innerHeight * 7;
            const cards = document.querySelectorAll('.card');
            const countContainer = document.querySelector('.count-container');
            const totalCards = cards.length;

            ScrollTrigger.create({
                trigger: stickySection,
                start: 'top top',
                end: `+=${stickyHeight}px`,
                pin: true,
                pinSpacing: true,
                scrub:1,
                onUpdate: (self) => {
                    positionCards(self.progress);
                },
            });

            const getRadius = () => {
                return window.innerWidth < 900 ? window.innerHeight * 7.5 : window.innerWidth * 2.5;
            };

            const arcAngle = Math.PI * 0.4;
            const startAngle = Math.PI / 2 - arcAngle / 2;

            function positionCards(progress = 0) {
                const radius = getRadius();
                const totalTravel = 1 + totalCards / 7.5;
                const adjustedprogress = (progress * totalTravel - 1) * 0.75;

                cards.forEach((card, i) => {
                    const noramlizedProgress = (totalCards - 1 - i) / totalCards;
                    const cardProgress = noramlizedProgress + adjustedprogress;
                    const angle = startAngle + arcAngle * cardProgress;

                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    const rotation = (angle - Math.PI / 2) * (180 / Math.PI);

                    gsap.set(card, {
                        x: x,
                        y: -y + radius,
                        rotation: -rotation,
                        transformOrigin: "center center",
                    })
                });
            }

            positionCards(0);
        })
    </script>
