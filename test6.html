<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,body{
            width: 100%;
            height: 800vh;
        }

        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1{
            text-transform: uppercase;
            font-weight: lighter;
            font-size: 64px;
            line-height: 1;
        }

        h1 span{
            color: tomato;
        }

        p{
            font-size: 14px;
            font-weight: 500;
        }

        section{
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .hero,.outro{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
        }

        .hero h1,.outro h1{
            text-align: center;
            font-size: 70px;
        }

        .bg-img{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        canvas{
            position: absolute;
            top: 0;
            left: 0;
            width: 150%;
            height: 150%;
        }

        canvas.outline-layer{
            z-index: 1;
        }

        canvas.fill-layer{
            z-index: 10;
        }

        .cards{
            position: absolute;
            top: 0;
            left: 0;
            width: 300%;
            height: 100vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            will-change: transform;
            z-index: 2;
        }

        .card{
            position: relative;
            width: 10%;
            height: 75%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            gap: 1em;
            padding: 1.5em;
        }

        .card-img,.card-title{
            flex: 1;
            overflow: hidden;
        }

        .card-title{
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @media(max-width:900px){
            .card{
                width: 25%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="hero">
            <h1>Enter a Universe Powered by Imagination</h1>
        </section>

        <section class="sticky">
            <div class="bg-img"><img src="./src/assets/T1.jpg" alt=""></div>

            <canvas class="outline-layer"></canvas>

            <div class="cards">
                <div class="card">
                    <div class="card-img"><img src="./src/assets/T3.jpg" alt=""></div>
                    <div class="card-title">
                        <h1>Slient Weil</h1>
                        <p>PROD8372</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-img"><img src="./src/assets/T4.jpg" alt=""></div>
                    <div class="card-title">
                        <h1>Slient Weil</h1>
                        <p>PROD8372</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-img"><img src="./src/assets/T5.jpg" alt=""></div>
                    <div class="card-title">
                        <h1>Slient Weil</h1>
                        <p>PROD8372</p>
                    </div>
                </div>
            </div>

            <canvas class="fill-layer"></canvas>
        </section>

        <section class="outro">
            <h1>Chase the Shadows to embrace the Light</h1>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded',()=>{
            gsap.registerPlugin(ScrollTrigger);

            const stickySection = document.querySelector('.sticky');
            const stickyHeight = window.innerHeight * 5;
            const outlineCanvas = document.querySelector('.outline-layer');
            const fillCanvas = document.querySelector('.fill-layer');
            const outlineCtx = outlineCanvas.getContext('2d');
            const fillCtx = fillCanvas.getContext('2d');

        })


    </script>
</body>
</html>
