<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1,a,p{
            text-transform: uppercase;
            color: #fff;
        }

        h1{
            font-size: 5rem;
            font-weight: 600;
            letter-spacing: -0.1rem;
        }

        p,a{
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: -0.01rem;
        }

        .slider{
            position: relative;
            width: 100vw;
            height: 100svh;
            background-color: #000;
            overflow: hidden;
        }

        .slide,.slide-img{
            width: 100vw;
            height: 100svh;
            position: absolute;
            top: 0;
            left: 0;
        }

        .slide{
            will-change: transform;
        }

        .slide-header{
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translate(-50%, 0);
            width: 75%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            z-index: 1;
        }

        .slide-description{
            width: 60%;
            text-align: center;
            margin-bottom: 1rem;
        }

        .slide-info{
            position: absolute;
            left: 0;
            bottom: 2rem;
            width: 100vw;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .slide-tags{
            display: flex;
            flex-direction: column;
        }

        .slide-index-wrapper{
            display: flex;
        }

        .slide-index-wrapper p{
            text-align: center;
            width: 2rem;
        }

        .slide-tags p:first-child{
            margin-bottom: 1rem;
        }

        .line,.word{
            position: relative;
            display: inline-block;
            will-change: transform;
        }

        @media(max-width:1000px){
            h1{
                font-size: 2rem;
                letter-spacing: 0;
            }

            p{
                font-size: 0.8rem;
            }

            .slide-header{
                top: 50%;
                bottom: unset;
                transform: translate(-50%,-50%);
                width: 90%;
            }

            .slide-description{
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slide">
            <div class="slide-img">
                <img src="/src/assets/test3.jpg" alt="">
            </div>
            <div class="slide-header">
                <div class="slide-title">
                    <h1>Monoohrome Signal</h1>
                </div>
                <div class="slide-description">
                    <p>A stripped-back visual experience blending luxury fashion with streetwear edge.Designed for blod statements and minimal distractions.</p>
                </div>
                <div class="slide-link">
                    <a href="#">View Project</a>
                </div>
            </div>
            <div class="slide-info">
                <div class="slide-tags">
                    <p>Tags</p>
                    <p>Monoohrome</p>
                    <p>Editorial</p>
                    <p>Fashion</p>
                    <p>Visual Identity</p>
                </div>
                <div class="slide-index-wrapper">
                    <p id="slide-index">01</p>
                    <p>/</p>
                    <p id="total-slide-count">04</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const slides = [
            {
                slideTitle:'没语季节1',
                slideDescription:'AAAAAAAAA',
                slideUrl:'/aaaa',
                slideTags:['a','b','c','d'],
                slideImg:'src/assets/test.jpg',
            },
            {
                slideTitle:'没语季节2',
                slideDescription:'BBBBBBBBB',
                slideUrl:'/aaaa',
                slideTags:['a','b','c','d'],
                slideImg:'src/assets/test3.jpg',
            },
            {
                slideTitle:'没语季节3',
                slideDescription:'CCCCCCCCC',
                slideUrl:'/aaaa',
                slideTags:['a','b','c','d'],
                slideImg:'src/assets/test.jpg',
            },
            {
                slideTitle:'没语季节4',
                slideDescription:'DDDDDDDDD',
                slideUrl:'/aaaa',
                slideTags:['a','b','c','d'],
                slideImg:'src/assets/test3.jpg',
            },
            {
                slideTitle:'没语季节5',
                slideDescription:'EEEEEEEEE',
                slideUrl:'/aaaa',
                slideTags:['a','b','c','d'],
                slideImg:'src/assets/test.jpg',
            },
            {
                slideTitle:'没语季节6',
                slideDescription:'FFFFFFFFF',
                slideUrl:'/aaaa',
                slideTags:['a','b','c','d'],
                slideImg:'src/assets/test2.jpg',
            }
        ];

        document.addEventListener('DOMContentLoaded',()=>{
            gsap.registerPlugin(SplitText);

            const totalSlides = slides.length;
            let currentSlide = 1;

            let isAnimating = false;
            let scrollAllowed = true;
            let lastScrollTime = 0;

            function createSlide(slideIndex){
                const slideData = slides[slideIndex - 1];

                const slide = document.createElement('div');
                slide.className = 'slide';

                const slideImg = document.createElement('div');
                slideImg.className = 'slide-img';
                const img = document.createElement('img');
                img.src = slideData.slideImg;
                img.alt = '';
                slideImg.appendChild(img);

                const slideHeader = document.createElement('div');
                slideHeader.className = 'slide-header';

                const slideTitle = document.createElement('div');
                slideTitle.className = 'slide-title';
                const h1 = document.createElement('h1');
                h1.textContent = slideData.slideTitle;
                slideTitle.appendChild(h1);

                const slideDescription = document.createElement('div');
                slideDescription.className = 'slide-description';
                const p = document.createElement('p');
                p.textContent = slideData.slideDescription;
                slideDescription.appendChild(p);

                const slideLink = document.createElement('div');
                slideLink.className = 'slide-link';
                const a = document.createElement('a');
                a.href = slideData.slideUrl;
                a.textContent = 'View Project'
                slideLink.appendChild(a);

                slideHeader.appendChild(slideTitle);
                slideHeader.appendChild(slideDescription);
                slideHeader.appendChild(slideLink);

                const slideInfo = document.createElement('div');
                slideInfo.className = 'slide-info';

                const slideTags = document.createElement('div');
                slideTags.className = 'slide-tags';
                const tagsLabel = document.createElement('p');
                tagsLabel.textContent = 'Tags';
                slideTags.appendChild(tagsLabel);

                slideData.slideTags.forEach((tag)=>{
                    const tagP = document.createElement('p');
                    tagP.textContent = tag;
                    slideTags.appendChild(tagP);
                });

                const slideIndexWrapper = document.createElement('div');
                slideIndexWrapper.className = 'slide-index-wrapper';
                const slideIndexCopy = document.createElement('p');
                slideIndexCopy.textContent = slideIndex.toString().padStart(2,'0');
                const slideIndexSeparator = document.createElement('p');
                slideIndexSeparator.textContent = '/';
                const slidesTotalCount = document.createElement('p');
                slidesTotalCount.textContent = totalSlides.toString().padStart(2,'0');

                slideIndexWrapper.appendChild(slideIndexCopy);
                slideIndexWrapper.appendChild(slideIndexSeparator);
                slideIndexWrapper.appendChild(slidesTotalCount);

                slideInfo.appendChild(slideTags);
                slideInfo.appendChild(slideIndexWrapper);

                slide.appendChild(slideImg);
                slide.appendChild(slideHeader);
                slide.appendChild(slideInfo);

                return slide;
            }

            function splitText(slide){
                const slideHeader = slide.querySelector('.slide-title h1');
                if(slideHeader){
                    SplitText.create(slideHeader,{
                        type:'words',
                        wordsClass:'word',
                        mask:'words',
                    });
                };
                const slideContent = slide.querySelectorAll('p,a');
                slideContent.forEach((element)=>{
                SplitText.create(element,{
                    type:'lines',
                    linesClass:'line',
                    mask:'lines',
                    reduceWhiteSpace:false,
                });
            });
            }

            function animateSlide(direction){
                if(isAnimating || !scrollAllowed) return;

                isAnimating = true;
                scrollAllowed = false;

                const slider = document.querySelector('.slider');
                const currentSlideElement = slider.querySelector('.slide');

                if(direction === 'down'){
                    currentSlide = currentSlide === totalSlides ? 1 : currentSlide + 1;
                } else {
                    currentSlide = currentSlide === 1 ? totalSlides : currentSlide - 1;
                }

                const exitY = direction === 'down' ? '-200vh' : '200vh';
                const entryY = direction === 'down' ? '100vh' : '-100vh';

                const entryClipPath = direction === 'down' ? 'polygon(20% 20%, 80% 20%, 80% 100%, 20% 100%)' : 'polygon(20% 0%, 80% 0%, 80% 80%, 20% 80%)';

                gsap.to(currentSlideElement,{
                    scale:0.25,
                    opacity:0,
                    rotation:30,
                    y:exitY,
                    duration:2,
                    ease:'power4.inOut',
                    onComplete:()=>{
                        currentSlideElement.remove();
                    },
                });

                setTimeout(() => {
                    const newSlide = createSlide(currentSlide);

                    gsap.set(newSlide,{
                        y:entryY,
                        clipPath:entryClipPath,
                    });

                    slider.appendChild(newSlide);

                    splitText(newSlide);

                    const words = newSlide.querySelectorAll('.word');
                    const lines = newSlide.querySelectorAll('.line');

                    gsap.set([...words,...lines],{
                        y:"100%",
                    });

                    gsap.to(newSlide,{
                        y:0,
                        clipPath:'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
                        duration:1.5,
                        ease :'power4.out',
                        onStart:()=>{
                            const tl = gsap.timeline();

                            const headerWords = newSlide.querySelectorAll('.slide-title .word');
                            tl.to(headerWords,{
                                y:'0%',
                                duration:1,
                                ease:'power4.out',
                                stagger:0.1,
                            },0.75);

                            const tagsLines = newSlide.querySelectorAll('.slide-tags .line');
                            const indexLines = newSlide.querySelectorAll('.slide-index-wrapper .line');
                            const descriptionLines = newSlide.querySelectorAll('.slide-description .line');

                            tl.to(tagsLines,{
                                y:'0%',
                                duration:1,
                                ease:'power4.out',
                                stagger:0.1,
                            },'-=0.75');

                            tl.to(indexLines,{
                                y:'0%',
                                duration:1,
                                ease:'power4.out',
                                stagger:0.1,
                            },'<');

                            tl.to(descriptionLines,{
                                y:'0%',
                                duration:1,
                                ease:'power4.out',
                                stagger:0.1,
                            },'<');

                            const linkLines = newSlide.querySelectorAll('.slide-link .line');
                            tl.to(linkLines,{
                                y:'0%',
                                duration:1,
                                ease:'power4.out',
                            },'-=1');
                        },
                        onComplete:()=>{
                            isAnimating =false;
                            setTimeout(() => {
                                scrollAllowed = true;
                                lastScrollTime = Date.now();
                            }, 100);
                        },
                    });
                }, 750);
            }

            function handleScroll(direction){
                const now = Date.now();

                if(isAnimating || !scrollAllowed) return;
                if(now - lastScrollTime < 1000) return;

                lastScrollTime = now;
                animateSlide(direction);
            };

            window.addEventListener('wheel',(e)=>{
                e.preventDefault();
                const direction = e.deltaY > 0 ? 'down' : 'up';
                handleScroll(direction);
            },{
                passive:false,
            });

            let touchStartY = 0;
            let isTouchActive = false;

            window.addEventListener('touchstart',(e)=>{
                touchStartY = e.touches[0].clientY;
                isTouchActive =true;
            },{passive:false});

        window.addEventListener('touchmove',(e)=>{
            e.preventDefault();
            if(!isTouchActive || isAnimating || !scrollAllowed) return;

            const touchCurrentY = e.touches[0].clientY;
            const difference = touchStartY - touchCurrentY;

            if(Math.abs(difference) >50){
                isTouchActive = false;
                const direction = difference > 0 ? 'down': 'up';
                handleScroll(direction);
            }
        },{passive:false});

        window.addEventListener('touchend',()=>{
          isTouchActive = false;  
        });
        });
    </script>
</body>
</html>
