<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container{
            width: 100%;
            height:100vh;
            background-color: bisque;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index:1;
        }

        .nav{
            width: 100%;
            height:100vh;
            background-color: #6f9dff;
            position: fixed;
            left:0;
            top:0;
            opacity: 0;
            z-index: -1;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Home</h1>
        <button id="opennav">Click Me</button>
    </div>
    <div class="container">
        <h1>About</h1>
    </div>
    <div class="nav">
        <h1>Navbar</h1>
        <button id="closenav">Click Me</button>
    </div>

    <script>
        function openNav(){
            const tl = gsap.timeline();
            tl.to('.container',{duration:2,autoAlpha:0})
            .to('.nav',{duration:2,autoAlpha:1,zIndex:100},'<')
            .to('body',{overflow:'hidden'},'<')
        }

        opennav.addEventListener('click',openNav)

        function closeNav(){
            const tl = gsap.timeline();
            tl.to('.nav',{duration:2,autoAlpha:0,zIndex:-100})
            .to('.container',{duration:2,autoAlpha:1},'<')
            .to('body',{overflow:'visible'},'<')
        }

        closenav.addEventListener('click',closeNav)

    </script>
</body>
</html>
